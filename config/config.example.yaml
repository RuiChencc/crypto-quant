# crypto-quant 配置示例
# 复制为 config.yaml 后填写真实参数

exchange:
  name: binance          # binance / okx / bybit / gate / kraken / bitget
  sandbox: true          # true=模拟盘（推荐先跑）, false=实盘
  api_key: ""            # 实盘才需要
  api_secret: ""

market:
  symbol: BTC/USDT
  timeframe: 1h          # 1m / 5m / 15m / 1h / 4h / 1d
  limit: 500

strategy:
  name: ma_cross
  params:
    short_window: 10
    long_window: 30

backtest:
  initial_capital: 10000
  fee_rate: 0.001
  slippage: 0.0005

risk:
  max_position_pct: 0.3
  stop_loss_pct: 0.05
  take_profit_pct: 0.10
  max_daily_loss_pct: 0.03
  max_open_trades: 5

report:
  output_dir: output
