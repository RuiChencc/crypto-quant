[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-quant"
version = "0.1.0"
description = "Cryptocurrency quantitative research framework (architecture inspired by freqtrade)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "ccxt>=4.0",
    "pandas>=2.0",
    "numpy>=1.24",
]

[tool.setuptools]
packages = ["data", "strategy", "backtest", "execution", "risk", "report"]
